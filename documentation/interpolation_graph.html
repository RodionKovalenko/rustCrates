<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Interpolation Graph</title>
  <style>
    body { font-family: sans-serif; background: #1e1e2e; color: #cdd6f4; display: flex; flex-direction: column; align-items: center; padding: 40px; }
    h2 { margin-bottom: 8px; }
    svg { background: #181825; border-radius: 12px; box-shadow: 0 4px 32px #0008; }
    .legend { display: flex; gap: 28px; margin-top: 16px; font-size: 14px; }
    .legend-item { display: flex; align-items: center; gap: 8px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; }
  </style>
</head>
<body>
  <h2>Linear Interpolation: (1.5, −1.5) → (4.5, 2.0)</h2>

  <svg width="600" height="480" viewBox="0 0 600 480">
    <defs>
      <marker id="arrowX" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
        <path d="M0,0 L0,6 L8,3 z" fill="#585b70"/>
      </marker>
      <marker id="arrowY" markerWidth="8" markerHeight="8" refX="3" refY="6" orient="auto">
        <path d="M0,6 L6,6 L3,0 z" fill="#585b70"/>
      </marker>
    </defs>

    <!-- coordinate mapping:
         x domain [0, 6]  → svg x: 80 + x * 80
         y domain [-2, 3] → svg y: 400 - (y+2) * 80
    -->

    <!-- grid lines -->
    <g stroke="#313244" stroke-width="1">
      <!-- vertical -->
      <line x1="160" y1="40" x2="160" y2="420"/>
      <line x1="240" y1="40" x2="240" y2="420"/>
      <line x1="320" y1="40" x2="320" y2="420"/>
      <line x1="400" y1="40" x2="400" y2="420"/>
      <line x1="480" y1="40" x2="480" y2="420"/>
      <!-- horizontal -->
      <line x1="60" y1="340" x2="560" y2="340"/>  <!-- y=-1 -->
      <line x1="60" y1="260" x2="560" y2="260"/>  <!-- y=0  -->
      <line x1="60" y1="180" x2="560" y2="180"/>  <!-- y=1  -->
      <line x1="60" y1="100" x2="560" y2="100"/>  <!-- y=2  -->
    </g>

    <!-- axes -->
    <line x1="80" y1="420" x2="555" y2="420" stroke="#585b70" stroke-width="2" marker-end="url(#arrowX)"/>
    <line x1="80" y1="420" x2="80"  y2="45"  stroke="#585b70" stroke-width="2" marker-end="url(#arrowY)"/>

    <!-- axis tick labels x -->
    <g fill="#6c7086" font-size="13" text-anchor="middle">
      <text x="160" y="438">1</text>
      <text x="240" y="438">2</text>
      <text x="320" y="438">3</text>
      <text x="400" y="438">4</text>
      <text x="480" y="438">5</text>
      <text x="560" y="438">x</text>
    </g>

    <!-- axis tick labels y -->
    <g fill="#6c7086" font-size="13" text-anchor="end">
      <text x="70" y="344">−1</text>
      <text x="70" y="264">0</text>
      <text x="70" y="184">1</text>
      <text x="70" y="104">2</text>
      <text x="70" y="60">y</text>
    </g>

    <!-- the interpolation line extended slightly beyond knots -->
    <!-- x=1.0 → svg_x=160, y on line = -1.5 + (3.5/3)*(1.0-1.5) = -1.5 - 0.583 = -2.083 → clamp -->
    <!-- draw from x=1.0 to x=5.0 -->
    <!-- x=1.0: y = -1.5 + (3.5/3)*(1.0-1.5) = -1.5 - 0.5833 = -2.0833  → svg_y = 400 - (-2.0833+2)*80 = 400 - (-0.0833*80) = 400+6.67 = 406.67 -->
    <!-- x=5.0: y = -1.5 + (3.5/3)*(5.0-1.5) = -1.5 + 4.0833 = 2.5833   → svg_y = 400 - (2.5833+2)*80 = 400 - 367 = 33 (clamp to ~48) -->
    <line
      x1="160" y1="406"
      x2="480" y2="54"
      stroke="#89b4fa" stroke-width="2.5" stroke-dasharray="0"
      opacity="0.7"
    />

    <!-- dashed drop line from (4.0, 1.4166) to x-axis -->
    <!-- svg_x = 80 + 4*80 = 400, svg_y = 400 - (1.4166+2)*80 = 400 - 273.3 = 126.7 -->
    <line x1="400" y1="127" x2="400" y2="420" stroke="#a6e3a1" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.6"/>
    <line x1="80" y1="127" x2="400" y2="127"  stroke="#a6e3a1" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.6"/>

    <!-- dashed drop line from (4.0, 1.5) to x-axis -->
    <!-- svg_y = 400 - (1.5+2)*80 = 400 - 280 = 120 -->
    <line x1="400" y1="120" x2="400" y2="420" stroke="#f38ba8" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.5"/>
    <line x1="80" y1="120" x2="400" y2="120"  stroke="#f38ba8" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.5"/>

    <!-- knot point (1.5, -1.5): svg_x=80+1.5*80=200, svg_y=400-(-1.5+2)*80=400-40=360 -->
    <circle cx="200" cy="360" r="7" fill="#89b4fa" stroke="#1e1e2e" stroke-width="2"/>
    <text x="215" y="357" fill="#89b4fa" font-size="13">(1.5, −1.5)</text>

    <!-- knot point (4.5, 2.0): svg_x=80+4.5*80=440, svg_y=400-(2+2)*80=400-320=80 -->
    <circle cx="440" cy="80" r="7" fill="#89b4fa" stroke="#1e1e2e" stroke-width="2"/>
    <text x="452" y="77" fill="#89b4fa" font-size="13">(4.5, 2.0)</text>

    <!-- interpolated point (4.0, 1.4166): svg_x=400, svg_y=127 -->
    <circle cx="400" cy="127" r="7" fill="#a6e3a1" stroke="#1e1e2e" stroke-width="2"/>
    <text x="410" y="124" fill="#a6e3a1" font-size="13">(4.0, 1.4166) ✓</text>

    <!-- "expected" wrong point (4.0, 1.5): svg_x=400, svg_y=120 -->
    <circle cx="400" cy="120" r="6" fill="none" stroke="#f38ba8" stroke-width="2.5" stroke-dasharray="3,2"/>
    <text x="410" y="155" fill="#f38ba8" font-size="13">(4.0, 1.5) ✗ off-line</text>

    <!-- arrow pointing to the gap -->
    <line x1="398" y1="120" x2="398" y2="127" stroke="#fab387" stroke-width="2"/>
    <circle cx="398" cy="123" r="0" fill="none"/>
    <!-- gap label -->
    <text x="355" y="137" fill="#fab387" font-size="11">Δ = 0.083</text>
  </svg>

  <div class="legend">
    <div class="legend-item"><div class="dot" style="background:#89b4fa"></div> Knot points</div>
    <div class="legend-item"><div class="dot" style="background:#a6e3a1"></div> Interpolated value (correct)</div>
    <div class="legend-item"><div class="dot" style="background:#f38ba8; border: 2px dashed #f38ba8; background:none; border-radius:50%; width:10px; height:10px"></div> Expected value (off-line)</div>
  </div>
</body>
</html>
