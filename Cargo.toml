[package]
name = "wav-transformer"
version = "0.1.0"
authors = ["Rodion Kovalenko <rodion.kovalenko@npo-applications.de>"]
edition = "2021"
build = "build.rs"

[lib]
name = "neural_networks"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]  # Both Python and Rust compatible

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
backtrace = "0.3.76"
rand = "0.10.2"
assert_approx_eq = "1.1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_derive = "1.0.229"
serde_json = "1.0.151"
num = "0.4.3"
num-complex = { version = "0.4.6", features = ["serde"] }
enigo = "0.6.1"
webbrowser = "1.2.4"
url = "2.5.8"
curl = "0.4.50"
futures = "0.3.34"
hyper = "1.11.0"
tokio = { version = "1.53.1", features = ["full"] }
reqwest = { version = "0.13.4", features = ["blocking"] }
flate2 = "1.1.10"
error-chain = "0.12.4"
chrono = { version = "0.4.45", features = ["serde"] }
num-traits = "0.2.19"
cast = "0.3.0"
image = "0.25.10"
serde-big-array = "0.5.1"
sled = "0.34.7"
tokenizers = "0.23.1"
rand_distr = "0.6.0"
plotters = "0.3.7"
yahoo_finance_api = "4.2.0"
time = "0.3.55"
csv = "1.4.0"
faer = "0.24.4"
rayon = "1.12.0"
bincode = "1.3.3"
lazy_static = "1.5.0"
once_cell = "1.21.4"
statrs = "0.19.1"
thiserror = "2.0.20"
hf-hub = "1.0.0"
anyhow = "1.0.104"
num_cpus = "1.17.0"
actix-web = "4.15.0"
tera = { version = "2.3.0", features = ["glob_fs"] }
encoding_rs = "0.8.35"
colored = "3.1.1"
cust = { version = "0.3.2", optional = true }
rustacuda = "0.1.3"
rustacuda_core = "0.1.2"
cudarc = { version = "0.19.9", optional = true, features = ["cublas"] }
cublas-sys = { version = "0.1.0", optional = true }
cc = "1.4.4"
ndarray = { version = "0.17.2" }

[package.metadata.maturin]
name = "neural_networks"

[features]
default = ["cpu"]
cpu = []
cuda = ["cust", "cudarc", "cudarc/cuda-12090", "cudarc/cublas"]
cublas = []

# Numeric precision (default is f32). Enable `dtype-f64` to build/run the whole crate in f64.
dtype-f64 = []

[profile.release]
opt-level = 3     # Optimize for size "z", for speeed 3
lto = true        # Enable Link Time Optimization
codegen-units = 1 # Reduce the number of codegen units to improve optimization

# Fast-turnaround profile for command-line tooling (sampling, diagnostics,
# image export). `release` spends 9-15 minutes on LTO with a single codegen
# unit, which is the right trade for a training run that then executes for
# hours -- and completely the wrong one for a tool that runs for two seconds.
# Dropping LTO and parallelising codegen cuts the build to a couple of minutes
# at a few percent of runtime speed, which no one can measure on a task this
# short.
#
#   cargo build --profile quick
[profile.quick]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 16
