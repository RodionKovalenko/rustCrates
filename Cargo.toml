[package]
name = "wav-transformer"
version = "0.1.0"
authors = ["Rodion Kovalenko <rodion.kovalenko@npo-applications.de>"]
edition = "2021"
build = "build.rs"

[lib]
name = "neural_networks"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]  # Both Python and Rust compatible

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
backtrace = "0.3.76"
rand = "0.9.2"
assert_approx_eq = "1.0.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_derive = "1.0.228"
serde_json = "1.0.145"
num = "0.4"
num-complex = { version = "0.4", features = ["serde"] }
enigo = "0.6.0"
webbrowser = "1.0.4"
url = "2.5.7"
curl = "0.4.49"
futures = "0.3.30"
hyper = "1.7.0"
tokio = { version = "1.47.1", features = ["full"] }
reqwest = "0.12.23"
error-chain = "0.12"
chrono = { version = "0.4.42", features = ["serde"] }
num-traits = "0.2.14"
cast = "0.3.0"
image = "0.25.8"
serde-big-array = "0.5.1"
sled = "0.34"
tokenizers = "0.22.1"
rand_distr = "0.5.1"
plotters = "0.3"
yahoo_finance_api = "4.1.0"
time = "0.3.44"
csv = "1.1"
faer = "0.23.2"
rayon = "1.11.0"
bincode = "1.3"
lazy_static = "1.4"
statrs = "0.18"
thiserror = "2.0.16"
hf-hub = { version = "0.4.2", features = ["tokio"] }
anyhow = "1.0.100"
num_cpus = "1.17"
actix-web = "4"
tera = "1.17"
encoding_rs = "0.8"
colored = "3.0.0"
# cuda-sys = "0.2"
cc = "1.0"
pyo3 = { version = "0.22.6", features = ["extension-module", "abi3-py37"] }
ndarray = { version = "0.16.0", features = ["blas"] }
openblas-src = { version = "0.10.13", features = ["system"] }

[package.metadata.maturin]
name = "neural_networks"

[profile.release]
opt-level = 3     # Optimize for size "z", for speeed 3
lto = true        # Enable Link Time Optimization
codegen-units = 1 # Reduce the number of codegen units to improve optimization
